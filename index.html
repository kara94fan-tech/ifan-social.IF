<!DOCTYPE html>
<html lang="id">
<head><style>

  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>social live.IF - Tarkam MVP FIX</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#121212">
<style>
  *{box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
  body{margin:0;background:#0a0a0a;color:#fff;min-height:100vh}
  .topbar{padding:12px 16px;display:flex;align-items:center;gap:10px;background:#121212;border-bottom:1px solid #222;position:sticky;top:0;z-index:10}
  .dot{width:10px;height:10px;background:#ff2a2a;border-radius:50%;box-shadow:0 0 10px #ff2a2a;animation:blink 1s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
  .wrap{max-width:520px;margin:0 auto;padding:16px}
  .card{background:#1a1a1a;border-radius:24px;padding:20px;margin:14px 0;border:1px solid #2a2a2a}
  /* PAPAN SKOR FIX - SELALU MUNCUL */
  .papan-skor-live{
    background:linear-gradient(135deg,#000 0%,#1a1a1a 100%);
    border:2px solid #fff;
    border-radius:20px;
    padding:20px;
    text-align:center;
    margin:12px 0;
    box-shadow:0 8px 30px rgba(255,255,255,0.15);
    position:relative;
    overflow:hidden;
  }
  .papan-skor-live::before{
    content:'LIVE SCORE';
    position:absolute;top:8px;left:50%;transform:translateX(-50%);
    font-size:9px;letter-spacing:3px;color:#ff2a2a;font-weight:900;
  }
  .tim-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
  .tim-name{font-size:16px;font-weight:800;background:#222;padding:8px 14px;border-radius:10px;min-width:90px}
  .skor-tengah{font-size:42px;font-weight:900;letter-spacing:2px}
  .waktu{margin-top:8px;color:#22c55e;font-weight:800;font-size:18px;font-family:monospace}
  .status-kamera{font-size:12px;color:#888;margin-top:6px}
  .btn{width:100%;padding:14px;border-radius:14px;border:none;font-weight:800;font-size:15px;cursor:pointer}
  .btn-primary{background:#fff;color:#000}
  .btn-outline{background:#222;color:#fff;border:1px solid #444;margin-top:8px}
  .btn-install{background:#fff;color:#000;display:none;margin-bottom:12px}
  .btn-gol{background:#fff;color:#000;font-size:22px;padding:10px}
  input{width:100%;background:#2a2a2a;border:1px solid #3a3a3a;border-radius:12px;padding:12px;color:#fff;margin-bottom:8px}
  .live-badge{display:inline-flex;align-items:center;gap:6px;background:#ff2a2a;color:#fff;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800}
</style>
</head>
<body>
<div class="topbar"><div class="dot"></div><b>social live.IF</b><span style="margin-left:auto;font-size:11px;color:#888">Tarkam MVP v2 FIX</span></div>
<div class="wrap">

<button id="btnPasang" class="btn btn-install">📲 PASANG APLIKASI OTOMATIS</button>
<div id="statusPasang" style="display:none;text-align:center;color:#22c55e;font-size:12px;margin-bottom:12px"></div>

<!-- LOGIN -->
<div class="card">
  <h1 style="text-align:center;margin:0;font-size:36px;font-weight:900">social live.IF</h1>
  <p style="text-align:center;color:#888;font-size:13px">Masuk untuk menggunakan aplikasi</p>
  <input type="email" placeholder="Email">
  <input type="password" placeholder="Password">
  <button class="btn btn-primary">MASUK</button>
  <button class="btn btn-outline">DAFTAR AKUN</button>
</div>

<!-- LIVE + PAPAN SKOR - INI YANG KEMARIN HILANG -->
<div class="card" style="border:2px solid #333">
  <div class="live-badge"><span class="dot" style="width:6px;height:6px"></span> LIVE TARKAM AKTIF</div>
  <h3 style="margin:12px 0 4px">🔴 Kolom Live - Papan Skor</h3>
  
  <!-- PAPAN SKOR UTAMA - FIX MUNCUL -->
  <div class="papan-skor-live" id="papanSkor">
    <div class="tim-row">
      <div class="tim-name" id="labelA">TIM A</div>
      <div class="skor-tengah"><span id="skorA">0</span> <span style="color:#555">:</span> <span id="skorB">0</span></div>
      <div class="tim-name" id="labelB">TIM B</div>
    </div>
    <div class="waktu" id="waktuLive">00:00</div>
    <div class="status-kamera" id="viewLive">👁 0 penonton • social live.IF - Kamera Lapangan</div>
  </div>

  <!-- KONTROL -->
  <div style="background:#000;border-radius:14px;padding:12px;border:1px solid #222">
    <b style="font-size:12px;color:#aaa">Setup Pertandingan</b>
    <div style="display:flex;gap:8px;margin-top:8px">
      <input id="timA" placeholder="Nama TIM A" oninput="updateLabel()">
      <input id="timB" placeholder="Nama TIM B" oninput="updateLabel()">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px">
      <button class="btn btn-gol" onclick="gol('A')">⚽ A +1</button>
      <button class="btn btn-gol" style="background:#ff2a2a;color:#fff" onclick="startTimer()" id="btnTimer">▶️ Timer</button>
      <button class="btn btn-gol" onclick="gol('B')">⚽ B +1</button>
    </div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn btn-outline" style="flex:1" onclick="resetAll()">Reset Skor</button>
      <button class="btn btn-outline" style="flex:1" onclick="mulaiKamera()">📹 Mulai Kamera</button>
    </div>
  </div>
</div>

<!-- DOMPET -->
<div class="card">
  <h3>💰 Dompet Live (Bagi Hasil 30/70)</h3>
  <p style="font-size:11px;color:#666">Total Saweran: <b id="totalSawer" style="color:#fff">Rp 0</b> | Kameramen 30%: <b id="kam30" style="color:#22c55e">Rp 0</b></p>
</div>

</div>

<script>
let sA=0,sB=0,detik=0,interval=null,total=0;
let deferredPrompt;
const btnPasang=document.getElementById('btnPasang');
const statusPasang=document.getElementById('statusPasang');

window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;
  btnPasang.style.display='block';
  statusPasang.style.display='block';
  statusPasang.textContent='✅ Siap pasang jadi APK';
});
btnPasang.addEventListener('click',async()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  btnPasang.style.display='none';
});
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js');}

function updateLabel(){
  document.getElementById('labelA').textContent=document.getElementById('timA').value||'TIM A';
  document.getElementById('labelB').textContent=document.getElementById('timB').value||'TIM B';
}
function gol(t){
  if(t==='A') sA++; else sB++;
  document.getElementById('skorA').textContent=sA;
  document.getElementById('skorB').textContent=sB;
}
function resetAll(){
  sA=0;sB=0;detik=0;
  document.getElementById('skorA').textContent='0';
  document.getElementById('skorB').textContent='0';
  document.getElementById('waktuLive').textContent='00:00';
  clearInterval(interval);document.getElementById('btnTimer').textContent='▶️ Timer';
}
function startTimer(){
  const btn=document.getElementById('btnTimer');
  if(interval){clearInterval(interval);interval=null;btn.textContent='▶️ Timer';return;}
  btn.textContent='⏸️ Pause';
  interval=setInterval(()=>{
    detik++;
    let m=String(Math.floor(detik/60)).padStart(2,'0');
    let s=String(detik%60).padStart(2,'0');
    document.getElementById('waktuLive').textContent=m+':'+s;
  },1000);
}
function mulaiKamera(){
  document.getElementById('viewLive').textContent='🔴 LIVE - Kamera aktif • 12 penonton';
  alert('Kamera siap! Papan skor akan otomatis overlay di live.');
}
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
