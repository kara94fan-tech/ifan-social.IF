<head>

<style>
*{box-sizing:border-box}

body{

header{

@media(max-width:420px){

</style>
</head>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  getDoc,
  setDoc,
  updateDoc,
  deleteDoc,
  doc,
  query,
  where,
  orderBy,
  serverTimestamp,
  arrayUnion,
  arrayRemove,
  increment
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
  apiKey:"AIzaSyBHLDNKvxJ_8cibdyJ4xhQWBmeUV4Wo1oE",
  authDomain:"ifan-social-web.firebaseapp.com",
  projectId:"ifan-social-web"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


/* =========================
   DATA
========================= */

let profile = {
  name:"Pengguna",
  avatar:""
};

let posts = [];
let cameraStream = null;


/* =========================
   ELEMENT
========================= */

function $(id){
  return document.getElementById(id);
}


/* =========================
   IMAGE
========================= */

function readImage(file){

  return new Promise((resolve,reject)=>{

    if(!file){
      resolve("");
      return;
    }

    const reader = new FileReader();

    reader.onload=e=>resolve(e.target.result);
    reader.onerror=reject;

    reader.readAsDataURL(file);

  });

}


/* =========================
   ESCAPE
========================= */

function esc(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   NAVIGATION
========================= */

window.showPage=function(page){

  document.querySelectorAll(".page")
    .forEach(p=>p.classList.remove("active"));

  const target=$(page);

  if(target){
    target.classList.add("active");
  }

  document.querySelectorAll(".nav-btn")
    .forEach(b=>b.classList.remove("active"));

  const index={
    home:0,
    live:1,
    create:2,
    notifications:3,
    profile:4
  }[page];

  if(index!==undefined){
    document.querySelectorAll(".nav-btn")[index]
      ?.classList.add("active");
  }

  if(page==="notifications"){
    loadNotifications();
  }

  if(page==="profile"){
    loadFollowCounts();
  }

};


/* =========================
   PROFILE
========================= */

async function loadProfile(){

  const user=auth.currentUser;

  if(!user)return;

  try{

    const ref=doc(db,"users",user.uid);

    const snap=await getDoc(ref);

    if(snap.exists()){

      const data=snap.data();

      profile={
        name:data.name || "Pengguna",
        avatar:data.avatar || ""
      };

    }else{

      profile={
        name:"Pengguna",
        avatar:""
      };

      await setDoc(ref,{
        uid:user.uid,
        name:"Pengguna",
        avatar:"",
        email:user.email || "",
        createdAt:serverTimestamp()
      });

    }

  }catch(error){

    console.error(error);

    const local=
      localStorage.getItem(
        "social_live_if_profile_"+user.uid
      );

    if(local){

      try{
        profile=JSON.parse(local);
      }catch(e){}

    }

  }

  updateProfileUI();

}


/* =========================
   PROFILE UI
========================= */

function updateProfileUI(){

  const user=auth.currentUser;

  $("profileName").textContent=
    profile.name || "Pengguna";

  $("nameInput").value=
    profile.name || "";

  $("profileEmail").textContent=
    user?.email || "";

  const avatar=
    profile.avatar ||
    "https://via.placeholder.com/150";

  $("profileAvatar").src=avatar;
  $("homeAvatar").src=avatar;
  $("createAvatar").src=avatar;

}


/* =========================
   SAVE PROFILE
========================= */

window.saveProfile=async function(){

  const user=auth.currentUser;

  if(!user)return;

  const name=
    $("nameInput").value.trim() || "Pengguna";

  const file=
    $("avatarInput").files[0];

  try{

    let avatar=profile.avatar || "";

    if(file){
      avatar=await readImage(file);
    }

    profile={
      name,
      avatar
    };

    await setDoc(
      doc(db,"users",user.uid),
      {
        uid:user.uid,
        name:name,
        avatar:avatar,
        email:user.email || "",
        updatedAt:serverTimestamp()
      },
      {merge:true}
    );

    localStorage.setItem(
      "social_live_if_profile_"+user.uid,
      JSON.stringify(profile)
    );

    updateProfileUI();

    alert("Profil berhasil disimpan.");

  }catch(error){

    console.error(error);

    alert(
      "Gagal menyimpan profil:\n"+
      error.message
    );

  }

};


/* =========================
   REGISTER
========================= */

window.registerUser=async function(){

  const email=$("email").value.trim();
  const password=$("password").value;

  $("loginMessage").textContent="";

  if(!email || !password){

    $("loginMessage").textContent=
      "Isi email dan password.";

    return;
  }

  if(password.length<6){

    $("loginMessage").textContent=
      "Password minimal 6 karakter.";

    return;
  }

  try{

    const result=
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    await setDoc(
      doc(db,"users",result.user.uid),
      {
        uid:result.user.uid,
        name:"Pengguna",
        avatar:"",
        email:email,
        createdAt:serverTimestamp()
      }
    );

  }catch(error){

    console.error(error);

    $("loginMessage").textContent=
      error.message;

  }

};


/* =========================
   LOGIN
========================= */

window.loginUser=async function(){

  const email=$("email").value.trim();
  const password=$("password").value;

  $("loginMessage").textContent="";

  if(!email || !password){

    $("loginMessage").textContent=
      "Isi email dan password.";

    return;
  }

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    console.error(error);

    $("loginMessage").textContent=
      error.message;

  }

};


/* =========================
   LOGOUT
========================= */

window.logoutUser=async function(){

  stopCamera();

  await signOut(auth);

};


/* =========================
   ADD POST
========================= */

window.addPost=async function(){

  const user=auth.currentUser;

  if(!user){

    alert("Silakan login terlebih dahulu.");
    return;

  }

  const text=
    $("statusInput").value.trim();

  const file=
    $("postPhoto").files[0];

  if(!text && !file){

    alert("Tulis status atau pilih foto.");
    return;

  }

  try{

    const image=await readImage(file);

    const post={

      uid:user.uid,

      name:profile.name || "Pengguna",

      avatar:profile.avatar || "",

      text:text,

      image:image,

      likes:0,

      likedBy:[],

      savedBy:[],

      comments:[],

      time:new Date().toLocaleString("id-ID"),

      createdAt:serverTimestamp()

    };

    await addDoc(
      collection(db,"posts"),
      post
    );

    $("statusInput").value="";
    $("postPhoto").value="";

    await loadPosts();

    alert("Postingan berhasil dibuat.");

  }catch(error){

    console.error(error);

    alert(
      "Gagal membuat postingan:\n"+
      error.message
    );

  }

};


/* =========================
   BIG POST
========================= */

window.addBigPost=async function(){

  const text=
    $("bigStatus").value.trim();

  const file=
    $("bigPhoto").files[0];

  if(!text && !file){

    alert("Tulis sesuatu atau pilih foto.");
    return;

  }

  $("statusInput").value=text;

  if(file){

    const dt=new DataTransfer();

    dt.items.add(file);

    $("postPhoto").files=dt.files;

  }

  await addPost();

  $("bigStatus").value="";
  $("bigPhoto").value="";

};


/* =========================
   LOAD POSTS
========================= */

async function loadPosts(){

  try{

    const snap=
      await getDocs(
        collection(db,"posts")
      );

    posts=[];

    snap.forEach(item=>{

      posts.push({
        id:item.id,
        ...item.data()
      });

    });

    posts.sort((a,b)=>{

      const aa=
        a.createdAt?.seconds || 0;

      const bb=
        b.createdAt?.seconds || 0;

      return bb-aa;

    });

    renderPosts();

  }catch(error){

    console.error(error);

    $("posts").innerHTML=`
      <div class="empty">
        Gagal memuat postingan.
        <br>
        <small>${esc(error.message)}</small>
      </div>
    `;

  }

}


/* =========================
   RENDER POSTS
========================= */

function renderPosts(){

  if(!posts.length){

    $("posts").innerHTML=`
      <div class="empty">
        Belum ada postingan.
      </div>
    `;

    return;

  }

  const uid=auth.currentUser?.uid;

  $("posts").innerHTML=
    posts.map((p,index)=>{

      const avatar=
        p.avatar ||
        "https://via.placeholder.com/100";

      const comments=
        Array.isArray(p.comments)
          ?p.comments
          :[];

      const liked=
        Array.isArray(p.likedBy) &&
        uid &&
        p.likedBy.includes(uid);

      const saved=
        Array.isArray(p.savedBy) &&
        uid &&
        p.savedBy.includes(uid);

      const commentsHtml=
        comments.map(c=>`
          <div class="comment-text">
            <strong>${esc(c.name)}</strong><br>
            ${esc(c.text)}
          </div>
        `).join("");

      const own=
        uid===p.uid;

      return`

        <article class="post">

          <div class="post-head">

            <img
              class="avatar-small"
              src="${avatar}">

            <div class="post-user">

              <strong>
                ${esc(p.name || "Pengguna")}
              </strong>

              <div class="post-time">
                ${esc(p.time || "")}
              </div>

            </div>

            ${
              own
              ?
              `<button
                class="post-menu"
                onclick="postMenu(${index})">
                ⋮
              </button>`
              :
              ""
            }

          </div>

          ${
            p.text
            ?
            `<div class="post-body">
              ${esc(p.text)}
            </div>`
            :
            ""
          }

          ${
            p.image
            ?
            `<img
              class="post-image"
              src="${p.image}">
            `
            :
            ""
          }

          <div class="post-actions">

            <button onclick="likePost(${index})">
              ${liked?"❤️":"🤍"}
              ${Number(p.likes||0)}
            </button>

            <button onclick="toggleComments(${index})">
              💬 ${comments.length}
            </button>

            <button onclick="savePost(${index})">
              ${saved?"🔖":"🔖"}
            </button>

            <button onclick="sharePost(${index})">
              📤
            </button>

          </div>

          <div
            id="comments-${index}"
            class="comment-box">

            <div class="comment-row">

              <input
                id="comment-${index}"
                class="comment-input"
                placeholder="Tulis komentar...">

              <button
                class="comment-send"
                onclick="addComment(${index})">
                Kirim
              </button>

            </div>

            ${commentsHtml}

          </div>

        </article>

      `;

    }).join("");

}


/* =========================
   LIKE
========================= */

window.likePost=async function(index){

  const user=auth.currentUser;
  const p=posts[index];

  if(!user || !p)return;

  const liked=
    Array.isArray(p.likedBy) &&
    p.likedBy.includes(user.uid);

  try{

    if(liked){

      await updateDoc(
        doc(db,"posts",p.id),
        {
          likedBy:arrayRemove(user.uid),
          likes:increment(-1)
        }
      );

    }else{

      await updateDoc(
        doc(db,"posts",p.id),
        {
          likedBy:arrayUnion(user.uid),
          likes:increment(1)
        }
      );

      if(p.uid!==user.uid){

        await addDoc(
          collection(
            db,
            "users",
            p.uid,
            "notifications"
          ),
          {
            type:"like",
            fromUid:user.uid,
            fromName:profile.name,
            postId:p.id,
            text:
              profile.name+
              " menyukai postingan kamu.",
            createdAt:serverTimestamp()
          }
        );

      }

    }

    await loadPosts();

  }catch(error){

    console.error(error);

    alert(
      "Like gagal:\n"+
      error.message
    );

  }

};


/* =========================
   COMMENTS
========================= */

window.toggleComments=function(index){

  const box=$("comments-"+index);

  if(!box)return;

  box.style.display=
    box.style.display==="block"
      ?"none"
      :"block";

};


window.addComment=async function(index){

  const user=auth.currentUser;
  const p=posts[index];

  if(!user || !p)return;

  const input=$("comment-"+index);

  const text=input.value.trim();

  if(!text)return;

  const comment={

    uid:user.uid,

    name:profile.name || "Pengguna",

    text:text,

    time:new Date().toLocaleString("id-ID")

  };

  try{

    await updateDoc(
      doc(db,"posts",p.id),
      {
        comments:arrayUnion(comment)
      }
    );

    if(p.uid!==user.uid){

      await addDoc(
        collection(
          db,
          "users",
          p.uid,
          "notifications"
        ),
        {
          type:"comment",
          fromUid:user.uid,
          fromName:profile.name,
          postId:p.id,
          text:
            profile.name+
            " mengomentari postingan kamu.",
          createdAt:serverTimestamp()
        }
      );

    }

    await loadPosts();

    const box=$("comments-"+index);

    if(box){
      box.style.display="block";
    }

  }catch(error){

    console.error(error);

    alert(
      "Komentar gagal:\n"+
      error.message
    );

  }

};


/* =========================
   SAVE POST
========================= */

window.savePost=async function(index){

  const user=auth.currentUser;
  const p=posts[index];

  if(!user || !p)return;

  const saved=
    Array.isArray(p.savedBy) &&
    p.savedBy.includes(user.uid);

  try{

    await updateDoc(
      doc(db,"posts",p.id),
      {
        savedBy:saved
          ?arrayRemove(user.uid)
          :arrayUnion(user.uid)
      }
    );

    await loadPosts();

  }catch(error){

    console.error(error);

    alert(
      "Gagal menyimpan postingan:\n"+
      error.message
    );

  }

};


/* =========================
   SHARE
========================= */

window.sharePost=async function(index){

  const p=posts[index];

  if(!p)return;

  const text=
    (p.name||"Pengguna")+
    ": "+
    (p.text||"Postingan di social live.IF");

  try{

    if(navigator.share){

      await navigator.share({
        title:"social live.IF",
        text:text
      });

    }else{

      await navigator.clipboard.writeText(text);

      alert("Teks postingan disalin.");

    }

  }catch(error){

    console.log(error);

  }

};


/* =========================
   POST MENU
========================= */

window.postMenu=async function(index){

  const user=auth.currentUser;
  const p=posts[index];

  if(!user || !p)return;

  if(p.uid!==user.uid){

    alert("Kamu hanya bisa mengelola postingan sendiri.");
    return;

  }

  const action=
    prompt(
      "Pilih tindakan:\n\n"+
      "1 = Edit\n"+
      "2 = Hapus\n"+
      "3 = Batal"
    );

  if(action==="1"){

    const newText=
      prompt(
        "Edit isi postingan:",
        p.text || ""
      );

    if(newText===null)return;

    try{

      await updateDoc(
        doc(db,"posts",p.id),
        {
          text:newText
        }
      );

      await loadPosts();

    }catch(error){

      alert(
        "Gagal edit:\n"+
        error.message
      );

    }

  }

  if(action==="2"){

    if(!confirm("Hapus postingan ini?")){
      return;
    }

    try{

      await deleteDoc(
        doc(db,"posts",p.id)
      );

      await loadPosts();

    }catch(error){

      alert(
        "Gagal menghapus:\n"+
        error.message
      );

    }

  }

};


/* =========================
   SEARCH USERS
========================= */

window.searchUsers=async function(){

  const keyword=
    $("searchUserInput")
      .value
      .trim()
      .toLowerCase();

  const box=$("searchResults");

  if(!keyword){

    box.innerHTML="";
    return;

  }

  try{

    const snap=
      await getDocs(
        collection(db,"users")
      );

    const users=[];

    snap.forEach(item=>{

      const data=item.data();

      if(
        item.id!==auth.currentUser?.uid &&
        String(data.name||"")
          .toLowerCase()
          .includes(keyword)
      ){

        users.push({
          uid:item.id,
          ...data
        });

      }

    });

    if(!users.length){

      box.innerHTML=`
        <div class="empty"
          style="margin-top:10px">
          Pengguna tidak ditemukan.
        </div>
      `;

      return;

    }

    box.innerHTML=
      users.map(u=>`

        <div class="user-result">

          <img
            class="avatar-small"
            src="${
              u.avatar ||
              "https://via.placeholder.com/100"
            }">

          <div class="user-info">

            <strong>
              ${esc(u.name||"Pengguna")}
            </strong>

            <span class="small-text">
              ${esc(u.email||"")}
            </span>

          </div>

          <button
            class="follow-btn"
            onclick="toggleFollow('${u.uid}')">

            IKUTI

          </button>

        </div>

      `).join("");

  }catch(error){

    console.error(error);

    box.innerHTML=`
      <div class="empty">
        Gagal mencari pengguna.
        <br>
        <small>${esc(error.message)}</small>
      </div>
    `;

  }

};


/* =========================
   FOLLOW
========================= */

window.toggleFollow=async function(targetUid){

  const user=auth.currentUser;

  if(!user || !targetUid)return;

  if(user.uid===targetUid)return;

  try{

    const followingRef=
      doc(
        db,
        "users",
        user.uid,
        "following",
        targetUid
      );

    const followerRef=
      doc(
        db,
        "users",
        targetUid,
        "followers",
        user.uid
      );

    const followingSnap=
      await getDoc(followingRef);

    if(followingSnap.exists()){

      await deleteDoc(followingRef);
      await deleteDoc(followerRef);

    }else{

      await setDoc(
        followingRef,
        {
          uid:targetUid,
          createdAt:serverTimestamp()
        }
      );

      await setDoc(
        followerRef,
        {
          uid:user.uid,
          name:profile.name,
          avatar:profile.avatar || "",
          createdAt:serverTimestamp()
        }
      );

      await addDoc(
        collection(
          db,
          "users",
          targetUid,
          "notifications"
        ),
        {
          type:"follow",
          fromUid:user.uid,
          fromName:profile.name,
          text:
            profile.name+
            " mulai mengikuti kamu.",
          createdAt:serverTimestamp()
        }
      );

    }

    await loadFollowCounts();
    await searchUsers();

  }catch(error){

    console.error(error);

    alert(
      "Follow gagal:\n"+
      error.message
    );

  }

};


/* =========================
   FOLLOW COUNTS
========================= */

async function loadFollowCounts(){

  const user=auth.currentUser;

  if(!user)return;

  try{

    const followers=
      await getDocs(
        collection(
          db,
          "users",
          user.uid,
          "followers"
        )
      );

    const following=
      await getDocs(
        collection(
          db,
          "users",
          user.uid,
          "following"
        )
      );

    $("followersCount").textContent=
      followers.size;

    $("followingCount").textContent=
      following.size;

  }catch(error){

    console.error(error);

  }

}


/* =========================
   NOTIFICATIONS
========================= */

async function loadNotifications(){

  const user=auth.currentUser;

  if(!user)return;

  try{

    const snap=
      await getDocs(
        collection(
          db,
          "users",
          user.uid,
          "notifications"
        )
      );

    const list=[];

    snap.forEach(item=>{

      list.push({
        id:item.id,
        ...item.data()
      });

    });

    list.sort((a,b)=>{

      const aa=
        a.createdAt?.seconds || 0;

      const bb=
        b.createdAt?.seconds || 0;

      return bb-aa;

    });

    if(!list.length){

      $("notificationList").innerHTML=`
        <div class="empty">
          Belum ada notifikasi.
        </div>
      `;

      return;

    }

    $("notificationList").innerHTML=
      list.map(n=>`

        <div class="notification">

          🔔 ${esc(
            n.text || "Aktivitas baru."
          )}

        </div>

      `).join("");

  }catch(error){

    console.error(error);

    $("notificationList").innerHTML=`
      <div class="empty">
        Gagal memuat notifikasi.
        <br>
        <small>${esc(error.message)}</small>
      </div>
    `;

  }

}


/* =========================
   CAMERA
========================= */

window.startCamera=async function(){

  try{

    if(cameraStream){
      stopCamera();
    }

    cameraStream=
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:"environment"
        },

        audio:true

      });

    $("camera").srcObject=
      cameraStream;

    $("liveStatus").innerHTML=
      "🔴 <strong>LIVE AKTIF</strong><br>"+
      "Kamera sedang digunakan.";

  }catch(error){

    console.error(error);

    $("liveStatus").innerHTML=
      "Kamera tidak dapat dibuka.<br>"+
      "<small>"+
      esc(error.message)+
      "</small>";

  }

};


window.stopCamera=function(){

  if(cameraStream){

    cameraStream
      .getTracks()
      .forEach(track=>track.stop());

    cameraStream=null;

  }

  $("camera").srcObject=null;

  $("liveStatus").innerHTML=
    "Kamera belum dimulai.";

};


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  async user=>{

    if(user){

      $("loginScreen").style.display="none";

      $("app").style.display="block";

      $("appHeader").style.display="flex";

      $("bottomNav").style.display="flex";

      await loadProfile();

      await loadFollowCounts();

      await loadPosts();

    }else{

      $("loginScreen").style.display="block";

      $("app").style.display="none";

      $("appHeader").style.display="none";

      $("bottomNav").style.display="none";

      stopCamera();

    }

  }
);

</script>
